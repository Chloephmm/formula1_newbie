name: Automatic qualifying monitor

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: f1-data-writes
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Check whether work is due
        id: plan
        run: python ml/scripts/check_qualifying.py --plan --github-output "$GITHUB_OUTPUT"

      - name: Install OpenMP runtime
        if: steps.plan.outputs.needs_work == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        if: steps.plan.outputs.needs_work == 'true'
        run: pip install -r ml/requirements.txt

      - name: Run one due monitor action
        if: steps.plan.outputs.needs_work == 'true'
        run: python ml/scripts/check_qualifying.py --run
