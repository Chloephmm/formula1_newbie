name: Weekly refresh (data + accuracy bar)

# Every Monday: fetch the weekend's results/qualifying from Jolpica, then commit
#   • ml/data/raw/*            — the refreshed race + qualifying data
#   • web/public/data/next_race_prediction.json — the next estimated forecast
#   • ml/models/live_metrics.json — the recomputed accuracy bar
# so the deployed app rolls forward to the next race automatically.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: f1-main-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: ml/requirements-lock.txt

      - name: Install OpenMP runtime (LightGBM needs libgomp)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python deps
        run: pip install -r ml/requirements-lock.txt

      - name: Fetch latest data + roll snapshot + recompute accuracy bar
        run: python ml/scripts/refresh_for_next_race.py --backtest

      - name: Commit & push if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ml/data/raw web/public/data/next_race_prediction.json ml/models/live_metrics.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: weekly data + accuracy bar refresh [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
