name: Weekly refresh (data + accuracy bar)

# Every Monday: fetch the weekend's results/qualifying from Jolpica, then commit
#   • ml/data/raw/*            — the refreshed race + qualifying data
#   • ml/models/live_metrics.json — the recomputed accuracy bar
# so the deployed app is current without anyone clicking RUN.
#
# The next-race initial is archived by this job. Actual-qualifying updates are
# handled by the scheduled qualifying monitor; visitors never run the model.

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:        # manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: f1-data-writes
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OpenMP runtime (LightGBM needs libgomp)
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python deps
        run: pip install -r ml/requirements.txt

      - name: Fetch latest data + roll snapshot + recompute accuracy bar
        id: weekly-refresh
        continue-on-error: true
        run: python ml/scripts/refresh_for_next_race.py --backtest

      - name: Publish the coordinated weekly refresh
        if: always()
        run: python ml/scripts/publish_refresh.py --kind weekly

      - name: Report refresh failure after preserving completed outputs
        if: steps.weekly-refresh.outcome == 'failure'
        run: exit 1
