name: Qualifying prediction publisher

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

permissions:
  contents: write

concurrency:
  group: f1-data-writes
  cancel-in-progress: false
  queue: max

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: ml/requirements-lock.txt

      - name: Check whether work is due
        id: plan
        run: python ml/scripts/check_qualifying.py --plan --github-output "$GITHUB_OUTPUT"

      - name: Install OpenMP runtime
        if: steps.plan.outputs.needs_work == 'true'
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        if: steps.plan.outputs.needs_work == 'true'
        run: pip install -r ml/requirements-lock.txt

      - name: Run one due monitor action
        if: steps.plan.outputs.needs_work == 'true'
        run: python ml/scripts/check_qualifying.py --run
