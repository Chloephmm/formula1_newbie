name: Qualifying prediction publisher

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Optional season override (use together with round)"
        required: false
        type: string
      round:
        description: "Optional round override (use together with season)"
        required: false
        type: string
      dry_run:
        description: "Run checks without changing published JSON"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: f1-main-writes
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.14"
          cache: pip
          cache-dependency-path: ml/requirements-lock.txt

      - name: Install OpenMP runtime
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install Python dependencies
        run: pip install -r ml/requirements-lock.txt

      - name: Check and publish qualifying prediction
        env:
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_ROUND: ${{ inputs.round }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ -n "$INPUT_SEASON" || -n "$INPUT_ROUND" ]]; then
            if [[ -z "$INPUT_SEASON" || -z "$INPUT_ROUND" ]]; then
              echo "season and round must be supplied together" >&2
              exit 2
            fi
            args+=(--season "$INPUT_SEASON" --round "$INPUT_ROUND")
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python ml/scripts/publish_qualifying_prediction.py "${args[@]}"

      - name: Commit published artifacts
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/next_race_prediction.json
          git add web/public/data/prediction_status.json
          git add web/public/data/predictions/index.json
          git add 'web/public/data/predictions/*.json'
          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "chore: publish qualifying prediction [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
