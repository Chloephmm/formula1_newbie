name: Sync F1 stats

on:
  schedule:
    # Mondays 06:00 UTC, race season only (March–December).
    - cron: "0 6 * 3-12 1"
  workflow_dispatch: {} # manual, available year-round

permissions:
  contents: write

concurrency:
  group: f1-data-writes
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure publication author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Refresh stats
        working-directory: web
        run: npm run sync-stats

      - name: Publish the coordinated stats refresh
        run: python ml/scripts/publish_refresh.py --kind stats
